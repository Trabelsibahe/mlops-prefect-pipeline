<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Churn Prediction</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2a2d3e;
      --accent:    #6c63ff;
      --accent2:   #ff6584;
      --text:      #e2e8f0;
      --muted:     #8892a4;
      --green:     #34d399;
      --red:       #f87171;
      --radius:    12px;
      --font:      'Inter', sans-serif;
      --mono:      'JetBrains Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    header .eyebrow {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      font-family: var(--mono);
      margin-bottom: 12px;
    }

    header h1 {
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 600;
      letter-spacing: -1px;
      line-height: 1.1;
    }

    header h1 span {
      color: var(--accent);
    }

    header p {
      margin-top: 12px;
      color: var(--muted);
      font-size: 15px;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 32px;
    }

    .tab-btn {
      padding: 10px 24px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: var(--font);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .tab-btn:hover:not(.active) {
      border-color: var(--accent);
      color: var(--text);
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      max-width: 680px;
      margin: 0 auto;
    }

    .card h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 24px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card h2 .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    .field input, .field select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus, .field select:focus {
      border-color: var(--accent);
    }

    .field select option { background: var(--surface); }

    .btn {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-family: var(--font);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .result {
      margin-top: 24px;
      border-radius: 10px;
      padding: 20px;
      display: none;
      border: 1px solid var(--border);
    }

    .result.show { display: block; }
    .result.churned  { border-color: var(--red);   background: rgba(248,113,113,0.07); }
    .result.retained { border-color: var(--green);  background: rgba(52,211,153,0.07); }
    .result.success  { border-color: var(--green);  background: rgba(52,211,153,0.07); }
    .result.error    { border-color: var(--red);    background: rgba(248,113,113,0.07); }

    .result-label {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .churned  .result-label { color: var(--red);   }
    .retained .result-label { color: var(--green); }
    .success  .result-label { color: var(--green); }
    .error    .result-label { color: var(--red);   }

    .result-sub {
      font-size: 13px;
      color: var(--muted);
      font-family: var(--mono);
    }

    .prob-bar {
      margin-top: 16px;
      height: 6px;
      border-radius: 999px;
      background: var(--border);
      overflow: hidden;
    }

    .prob-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--accent2);
      transition: width 0.6s ease;
    }

    .prob-label {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
    }

    /* retrain params */
    .param-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 8px;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 20px;
      line-height: 1.6;
      padding: 12px;
      border-radius: 8px;
      background: rgba(108,99,255,0.08);
      border: 1px solid rgba(108,99,255,0.2);
    }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <div class="eyebrow">MLOps · Random Forest</div>
    <h1>Customer <span>Churn</span> Dashboard</h1>
    <p>Predict churn risk or retrain the model with new parameters</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('predict')">Predict</button>
    <button class="tab-btn"        onclick="switchTab('retrain')">Retrain</button>
  </div>

  <!-- ── PREDICT PANEL ── -->
  <div id="tab-predict" class="panel active">
    <div class="card">
      <h2><span class="dot"></span> Customer Features</h2>

      <div class="grid">
        <div class="field">
          <label>Credit Score</label>
          <input type="number" id="CreditScore" value="650" min="300" max="850"/>
        </div>
        <div class="field">
          <label>Gender</label>
          <select id="Gender">
            <option value="0">Female</option>
            <option value="1" selected>Male</option>
          </select>
        </div>
        <div class="field">
          <label>Age</label>
          <input type="number" id="Age" value="35" min="18" max="100"/>
        </div>
        <div class="field">
          <label>Tenure (years)</label>
          <input type="number" id="Tenure" value="5" min="0" max="10"/>
        </div>
        <div class="field">
          <label>Balance</label>
          <input type="number" id="Balance" value="75000"/>
        </div>
        <div class="field">
          <label>Num of Products</label>
          <input type="number" id="NumOfProducts" value="2" min="1" max="4"/>
        </div>
        <div class="field">
          <label>Has Credit Card</label>
          <select id="HasCrCard">
            <option value="1" selected>Yes</option>
            <option value="0">No</option>
          </select>
        </div>
        <div class="field">
          <label>Is Active Member</label>
          <select id="IsActiveMember">
            <option value="1" selected>Yes</option>
            <option value="0">No</option>
          </select>
        </div>
        <div class="field" style="grid-column: span 2;">
          <label>Estimated Salary</label>
          <input type="number" id="EstimatedSalary" value="50000"/>
        </div>
      </div>

      <button class="btn" id="predict-btn" onclick="runPredict()">Run Prediction</button>

      <div class="result" id="predict-result">
        <div class="result-label" id="result-label"></div>
        <div class="result-sub"  id="result-sub"></div>
        <div class="prob-bar"><div class="prob-fill" id="prob-fill"></div></div>
        <div class="prob-label"  id="prob-label"></div>
      </div>
    </div>
  </div>

  <!-- ── RETRAIN PANEL ── -->
  <div id="tab-retrain" class="panel">
    <div class="card">
      <h2><span class="dot"></span> Retrain Model</h2>

      <div class="hint">
        Retrains the Random Forest from scratch using <code>Churn_Modelling.csv</code>
        and saves the new model to disk. All future predictions will use the updated model.
      </div>

      <div class="param-row">
        <div class="field">
          <label>n_estimators — number of trees</label>
          <input type="number" id="n_estimators" value="100" min="10" max="1000"/>
        </div>
        <div class="field">
          <label>random_state — reproducibility seed</label>
          <input type="number" id="random_state" value="42"/>
        </div>
      </div>

      <button class="btn" id="retrain-btn" onclick="runRetrain()">Retrain Model</button>

      <div class="result" id="retrain-result">
        <div class="result-label" id="retrain-label"></div>
        <div class="result-sub"   id="retrain-sub"></div>
      </div>
    </div>
  </div>

  <script>
    const API = "http://127.0.0.1:8000";

    function switchTab(name) {
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.getElementById("tab-" + name).classList.add("active");
      event.target.classList.add("active");
    }

    function val(id) { return document.getElementById(id).value; }

    async function runPredict() {
      const btn = document.getElementById("predict-btn");
      const res = document.getElementById("predict-result");

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Predicting…';
      res.className = "result";

      try {
        const response = await fetch(API + "/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            CreditScore:     parseFloat(val("CreditScore")),
            Gender:          parseInt(val("Gender")),
            Age:             parseInt(val("Age")),
            Tenure:          parseInt(val("Tenure")),
            Balance:         parseFloat(val("Balance")),
            NumOfProducts:   parseInt(val("NumOfProducts")),
            HasCrCard:       parseInt(val("HasCrCard")),
            IsActiveMember:  parseInt(val("IsActiveMember")),
            EstimatedSalary: parseFloat(val("EstimatedSalary")),
          })
        });

        const data = await response.json();

        if (!response.ok) throw new Error(data.detail || "API error");

        const isChurn = data.prediction === 1;
        const pct = Math.round(data.probability * 100);

        document.getElementById("result-label").textContent = data.label;
        document.getElementById("result-sub").textContent   =
          `prediction: ${data.prediction}  |  churn probability: ${pct}%`;
        document.getElementById("prob-fill").style.width   = pct + "%";
        document.getElementById("prob-label").textContent  =
          `Churn probability: ${pct}%`;

        res.className = "result show " + (isChurn ? "churned" : "retained");

      } catch (err) {
        document.getElementById("result-label").textContent = "Error";
        document.getElementById("result-sub").textContent   = err.message;
        document.getElementById("prob-fill").style.width    = "0%";
        document.getElementById("prob-label").textContent   = "";
        res.className = "result show error";
      }

      btn.disabled = false;
      btn.textContent = "Run Prediction";
    }

    async function runRetrain() {
      const btn   = document.getElementById("retrain-btn");
      const res   = document.getElementById("retrain-result");

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Retraining…';
      res.className = "result";

      try {
        const n  = parseInt(val("n_estimators"));
        const rs = parseInt(val("random_state"));

        const response = await fetch(
          `${API}/retrain?n_estimators=${n}&random_state=${rs}`,
          { method: "POST" }
        );

        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "API error");

        document.getElementById("retrain-label").textContent = "Retrain Complete";
        document.getElementById("retrain-sub").textContent   = data.message;
        res.className = "result show success";

      } catch (err) {
        document.getElementById("retrain-label").textContent = "Error";
        document.getElementById("retrain-sub").textContent   = err.message;
        res.className = "result show error";
      }

      btn.disabled = false;
      btn.textContent = "Retrain Model";
    }
  </script>
</body>
</html>
